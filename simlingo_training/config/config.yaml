# @package _global_
defaults:
  - train_base
  - /data_module: carla_no_buckets
  - /model/vision_model: vlm
  - /data_module/base_dataset: dataset
  - _self_

model:
  lr: 3e-5
  predict_route_as_wps: True
  speed_wps_mode: 2d
  language_model:
    variant: 'Qwen/Qwen2-0.5B-Instruct'
    lora: False
    lora_alpha: 16
    lora_r: 16
    lora_dropout: 0.1
    hidden_size: 2048
    model: null
  vision_model:
    variant: 'OpenGVLab/InternVL2-1B'

data_module:
  base_dataset:
    data_path: /root/simlingo/database/simlingo
    bucket_path: /root/simlingo/database/simlingo
    pred_len: 11
    cut_bottom_quarter: True
    use_commentary: False
    use_qa: False
    qa_augmentation: False
    img_shift_augmentation: False
    hist_len: 1
    route_as: target_point_command
    use_lmdrive_commands: True
    use_old_towns: True
    use_town13: True
    use_safety_flag: False

seed: 42
gpus: 1
resume: False
resume_path: null
debug: False
overfit: 0
fp16_loss_scale: 32.0
enable_wandb: True
wandb_project: "simlingo"
wandb_name: "simple_config"
max_epochs: 5
precision: "16-mixed"
strategy: "deepspeed_stage_2"
val_every_n_epochs: 1
checkpoint: null